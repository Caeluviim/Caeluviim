name: Graph ingestion validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAELUVIIM_RUNTIME_ID: github-actions:${{ github.run_id }}:${{ github.run_attempt }}
      CAELUVIIM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run repository test suite
        run: python -m unittest discover -s tests -v
      - name: Audit complete production graph catalog
        run: python -m caeluviim_graph.cli catalog --output reports/generated/graph-catalog.json
      - name: Verify Compose configuration
        run: docker compose config --quiet
      - name: Start graph runtime and ingest manifests
        run: bash scripts/laptop/start.sh
      - name: Verify runtime status
        run: bash scripts/laptop/status.sh
      - name: Create runtime backup
        run: bash scripts/laptop/backup.sh
      - name: Verify backup artifacts
        run: |
          backup_dir="$(find backups -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          test -n "$backup_dir"
          test -f "$backup_dir/neo4j.dump"
          test -f "$backup_dir/system.dump"
          test -f "$backup_dir/SHA256SUMS.txt"
          echo "BACKUP_NAME=$(basename "$backup_dir")" >> "$GITHUB_ENV"
      - name: Restore runtime backup
        run: bash scripts/laptop/restore.sh "$BACKUP_NAME"
      - name: Verify restored runtime status
        run: bash scripts/laptop/status.sh
      - name: Stop graph runtime
        if: always()
        run: bash scripts/laptop/stop.sh
