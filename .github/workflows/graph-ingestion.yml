name: Graph ingestion validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: docker compose config --quiet
      - run: bash scripts/laptop/start.sh
      - run: bash scripts/laptop/status.sh
      - run: bash scripts/laptop/backup.sh
      - name: Verify backup artifacts
        run: |
          backup_dir="$(find backups -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          test -n "$backup_dir"
          test -f "$backup_dir/neo4j.dump"
          test -f "$backup_dir/system.dump"
          test -f "$backup_dir/SHA256SUMS.txt"
          echo "BACKUP_NAME=$(basename "$backup_dir")" >> "$GITHUB_ENV"
      - run: bash scripts/laptop/restore.sh "$BACKUP_NAME"
      - run: bash scripts/laptop/status.sh
      - run: bash scripts/laptop/stop.sh
