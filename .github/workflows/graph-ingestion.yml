name: Graph ingestion validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-ingest:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.06.0
        env:
          NEO4J_AUTH: neo4j/caeluviim-test
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p caeluviim-test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      NEO4J_URI: neo4j://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: caeluviim-test
      NEO4J_DATABASE: neo4j

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m caeluviim_graph.cli bootstrap
      - run: python -m caeluviim_graph.cli ingest examples/ingest-manifest.valid.json
