name: Validate synchronized core, web, and formal model

on:
  push:
    branches:
      - agent/synchronize-caeluviim-cycle2
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "compose.yaml"
      - "web/**"
      - "formal/**"
      - ".github/workflows/validate-core-web-formal.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "compose.yaml"
      - "web/**"
      - "formal/**"
      - ".github/workflows/validate-core-web-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-web-formal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    name: Python core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: python -m pytest
      - name: Validate Compose configuration
        run: docker compose config --quiet

  web-runtime:
    name: Web runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run web build and runtime tests
        run: npm test

  lean-formalization:
    name: Lean formalization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          test: false
