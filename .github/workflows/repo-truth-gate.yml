name: Repository Truth Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  truth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require runtime evidence for runtime claims
        run: python scripts/repo_truth_gate.py
