name: Materialize normalized plasma pleading matrix

on:
  push:
    branches:
      - task/minnesota-plasma-pleading-matrix
    paths:
      - .github/workflows/materialize-plasma-matrix.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/minnesota-plasma-pleading-matrix
          fetch-depth: 0
      - name: Decode and verify normalized matrix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import csv
          import io

          root = Path('.')
          parts = sorted((root / '.tmp/plasma-matrix').glob('payload.part*.b64'))
          if len(parts) != 4:
              raise SystemExit(f'expected 4 payload parts, found {len(parts)}')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw = gzip.decompress(base64.b64decode(encoded))
          expected = '5037bf8339fb36af27254d82b79d123960aa9693732f4c1f08c031a5d02b4665'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'sha256 mismatch: {actual}')

          rows = list(csv.reader(io.StringIO(raw.decode('utf-8'))))
          if len(rows) != 199:
              raise SystemExit(f'expected 199 rows, found {len(rows)}')
          widths = {len(row) for row in rows}
          if widths != {29}:
              raise SystemExit(f'expected exactly 29 columns, found {sorted(widths)}')

          out = root / 'legal/cases/minnesota-commercial-plasmapheresis/Minnesota_Commercial_Plasmapheresis_Pleading_Sufficiency_Matrix.csv'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(raw)
          PY
      - name: Commit normalized spreadsheet
        shell: bash
        run: |
          rm -rf .tmp/plasma-matrix
          rm -f .github/workflows/materialize-plasma-matrix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize pleading matrix column structure'
          git push origin HEAD:task/minnesota-plasma-pleading-matrix
