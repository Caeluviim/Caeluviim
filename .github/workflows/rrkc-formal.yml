name: RRKC formal verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "formal/rrkc/**"
      - ".github/workflows/rrkc-formal.yml"
  push:
    branches:
      - main
    paths:
      - "formal/rrkc/**"
      - ".github/workflows/rrkc-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and independently check RRKC Lean package
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/rrkc
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false
          use-github-cache: false
          use-mathlib-cache: false
